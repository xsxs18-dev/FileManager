name: FileManager
options:
  bundleIdPrefix: com.xsxs18
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  developmentLanguage: en
packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    from: 0.9.19
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  FileManager:
    type: application
    platform: iOS
    sources:
      - path: FileManager
    info:
      path: FileManager/Resources/Info.plist
      properties:
        UILaunchScreen: {}
        LSSupportsOpeningDocumentsInPlace: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: Files
            CFBundleTypeRole: Editor
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.data
              - public.content
              - public.folder
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSCameraUsageDescription: "FileManager needs camera access to scan documents."
        NSFaceIDUsageDescription: "FileManager uses Face ID to unlock protected folders."
        CFBundleVersion: "0"
        CFBundleShortVersionString: "1.3.3"
        CFBundleLocalizations:
          - en
          - de
        CFBundleURLTypes:
          - CFBundleURLName: com.xsxs18.FileManager
            CFBundleURLSchemes:
              - filemanager
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xsxs18.FileManager
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
    dependencies:
      - package: ZIPFoundation

schemes:
  FileManager:
    build:
      targets:
        FileManager: all
    run:
      config: Debug
